# CI: the three compose modes resolve and the scripts parse, on every pull request and push to main.
# CD: after a push to main, and once the "production" environment is approved, the server pulls
# main and re-applies the stack configuration (deploy/deploy.sh infra on the VPS).
name: Infra CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate compose and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fill the required variables with placeholders
        run: |
          fill='s/^(MYSQL_PASSWORD|MYSQL_ROOT_PASSWORD|SECURITY_RESET_PEPPER|SECURITY_CORS_ALLOWED_ORIGINS|DEVICE_MQTT_PUBLIC_HOST|MQTT_BACKEND_PASS|RABBITMQ_PASSWORD|INTERNAL_API_TOKEN|NOTIFICATION_WEB_URL)=$/\1=ci-placeholder/'
          sed -E "$fill" .env.example > .env
          sed -E "$fill" .env.prod.example > .env.prod

      - name: Local stack
        run: docker compose config -q

      - name: Development mode
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Production
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod config -q

      - name: Scripts
        run: |
          for script in prepare.sh make-admin.sh mosquitto/generate-dev-certs.sh deploy/*.sh; do
            bash -n "$script"
          done
          shellcheck -S error prepare.sh make-admin.sh mosquitto/generate-dev-certs.sh deploy/*.sh

      - name: Nginx site template
        run: |
          sed 's/DOMINIO/example.com/g' deploy/nginx-energy-monitor.conf > site.conf
          docker run --rm -v "$PWD/site.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  deploy:
    name: Deploy to production
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://energy-monitor.tech
    concurrency:
      group: production-infra
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the server to deploy/deploy.sh: the argument is the component.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" infra

      - name: Smoke test
        run: |
          curl -fsS https://energy-monitor.tech/ -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' https://energy-monitor.tech/api/v1/homes)" = 401
