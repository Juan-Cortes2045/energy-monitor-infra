# =============================================================================
# EnergyMonitor - Sitio de Nginx en el servidor (proxy HTTPS delante de la pila)
# =============================================================================
# Instalar (reemplaza DOMINIO por el dominio real, p. ej. energymonitor.tech):
#   sudo sed "s/DOMINIO/$DOMAIN/g" deploy/nginx-energy-monitor.conf \
#     | sudo tee /etc/nginx/sites-available/energy-monitor >/dev/null
#   sudo ln -s /etc/nginx/sites-available/energy-monitor /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMINIO -d www.DOMINIO       # web y API (agrega el bloque 443)
#   sudo certbot certonly --nginx -d mqtt.DOMINIO       # broker: certificado aparte
#
# El del broker va en un certificado propio porque renew-mqtt-cert.sh solo copia el que se
# llama mqtt.*. Certbot agrega el bloque 443 y la redireccion de HTTP a HTTPS del sitio web.
#
# Todo el dominio va al nginx del frontend (127.0.0.1:8081), que sirve la web y solo pasa
# /api/ al backend: /internal/** (autenticacion del broker) nunca queda expuesto.
# mqtt.DOMINIO esta aqui solo para que Certbot emita su certificado (HTTP-01); los
# dispositivos se conectan al puerto 8883, que publica Docker, no Nginx.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;

    # Fotos de perfil y cuerpos JSON; el backend valida su propio limite.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se reemplaza (no se agrega) para que el cliente no pueda inyectar una IP falsa.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mqtt.DOMINIO;

    location / {
        return 404;
    }
}
