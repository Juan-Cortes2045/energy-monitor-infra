# =============================================================================
# EnergyMonitor - Despliegue en un servidor (MySQL, RabbitMQ, broker, servicios y frontend)
# =============================================================================
# En el servidor, con los repositorios clonados uno al lado del otro (ver README):
#   cp .env.prod.example .env.prod      # y rellenalo
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Puertos publicados:
#   8883  MQTT sobre TLS, para los dispositivos (internet)
#   WEB_PORT (8081) en 127.0.0.1: la web y la API. Delante va un proxy HTTPS (Caddy/nginx)
#         que reenvia TODO el dominio aqui; el nginx del frontend solo pasa /api/ al API
#         gateway, que reparte entre los servicios de seguridad, dispositivos, mediciones,
#         hogares y notificaciones y el backend, y rechaza /internal/**.
#   15672 consola de RabbitMQ en 127.0.0.1, para abrirla con un tunel SSH
# El gateway, los seis servicios, MySQL, AMQP y el listener MQTT sin TLS (1883) quedan dentro de
# la red de Docker. deploy/deploy.sh comprueba su salud con el healthcheck de cada contenedor.
#
# El mosquitto.conf es el mismo que en desarrollo; aqui "device" es el contenedor.
# El certificado del broker es de Let's Encrypt (MQTT_CERT_DIR), no el de desarrollo.

name: energy-monitor-prod

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: energy_monitor
      MYSQL_USER: energy_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cola de los eventos entre los servicios (cuentas, correo, hogares y dispositivos). Nombre de
  # host fijo: RabbitMQ guarda sus datos por nodo y, con el nombre aleatorio de cada contenedor,
  # el volumen quedaria huerfano al recrearlo.
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  security:
    build:
      context: ${SECURITY_CONTEXT:-../backend/en-monitor-security-service}
    # La imagen corre como uid 10001. JWT_KEYS_DIR/private.pem debe poder leerlo ese usuario:
    # haz chown 10001 a las claves o pon en BACKEND_UID/BACKEND_GID el dueño de los archivos.
    user: "${BACKEND_UID:-10001}:${BACKEND_GID:-10001}"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que el backend: cada uno con sus tablas y sus changesets.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PRIVATE_KEY_PATH: /run/keys/private.pem
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      SECURITY_RESET_PEPPER: ${SECURITY_RESET_PEPPER:?SECURITY_RESET_PEPPER is required}
      # Cookies HttpOnly de la sesión web con Secure: el sitio se sirve por HTTPS.
      SECURITY_SESSION_COOKIE_SECURE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Antes de borrar una cuenta pregunta al servicio de hogares si puede (deletion-check).
      HOME_SERVICE_URL: http://home:8086
    volumes:
      - ${JWT_KEYS_DIR:?JWT_KEYS_DIR is required}:/run/keys:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Dispositivos: vinculacion, credenciales MQTT, autenticacion del broker, comandos y
  # conectividad. Solo recibe public.pem.
  device:
    build:
      context: ${DEVICE_CONTEXT:-../backend/en-monitor-device-service}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets device-*.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Pregunta al servicio de hogares si quien llama es miembro o dueño del hogar.
      HOME_SERVICE_URL: http://home:8086
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_DEVICE_SERVICE_USER: ${MQTT_DEVICE_SERVICE_USER:-em-device-service}
      MQTT_DEVICE_SERVICE_PASS: ${MQTT_DEVICE_SERVICE_PASS:?MQTT_DEVICE_SERVICE_PASS is required}
      # Las credenciales que el broker acepta para el servicio de mediciones (solo lee la telemetria).
      MQTT_MEASUREMENT_SERVICE_USER: ${MQTT_MEASUREMENT_SERVICE_USER:-em-measurement-service}
      MQTT_MEASUREMENT_SERVICE_PASS: ${MQTT_MEASUREMENT_SERVICE_PASS:?MQTT_MEASUREMENT_SERVICE_PASS is required}
      # Solo la red interna de Docker puede llamar a /internal/mqtt/auth/**.
      MQTT_AUTH_ALLOWED_NETWORKS: 172.16.0.0/12,127.0.0.1/32
      # Direccion del broker que la web escribe al modulo al vincularlo por Bluetooth.
      DEVICE_MQTT_PUBLIC_HOST: ${DEVICE_MQTT_PUBLIC_HOST:?DEVICE_MQTT_PUBLIC_HOST is required}
      DEVICE_MQTT_PUBLIC_PORT: ${DEVICE_MQTT_PUBLIC_PORT:-8883}
    volumes:
      - ${JWT_KEYS_DIR:?JWT_KEYS_DIR is required}/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Mediciones: guarda la telemetria de los modulos y sirve el historial, el consumo de un hogar
  # y los niveles de consumo; anuncia cada lectura al backend. Solo recibe public.pem.
  measurement:
    build:
      context: ${MEASUREMENT_CONTEXT:-../backend/en-monitor-measurement-service}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets measurement-*.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Miembros y limites de un hogar (servicio de hogares) y hogar de cada modulo (dispositivos).
      HOME_SERVICE_URL: http://home:8086
      DEVICE_SERVICE_URL: http://device:8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Unico que guarda las lecturas: se suscribe a la telemetria por el listener interno.
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_MEASUREMENT_SERVICE_USER: ${MQTT_MEASUREMENT_SERVICE_USER:-em-measurement-service}
      MQTT_MEASUREMENT_SERVICE_PASS: ${MQTT_MEASUREMENT_SERVICE_PASS:?MQTT_MEASUREMENT_SERVICE_PASS is required}
      MEASUREMENT_MQTT_ENABLED: "true"
    volumes:
      - ${JWT_KEYS_DIR:?JWT_KEYS_DIR is required}/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Hogares: hogares, miembros, roles, transferencia del dueño, umbrales y tipos de hogar; responde
  # a los otros servicios quien puede actuar sobre un hogar. Solo recibe public.pem.
  home:
    build:
      context: ${HOME_CONTEXT:-../backend/en-monitor-home-service}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets home-*.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      SECURITY_SERVICE_URL: http://security:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Publica home.deleted desde su outbox y limpia las cuentas borradas (account.deleted): el
      # backend ya no tiene modulo de hogares. En false solo para volver a un backend que aun lo tenga.
      HOME_OUTBOX_RELAY_ENABLED: ${HOME_OUTBOX_RELAY_ENABLED:-true}
      ACCOUNT_DELETED_CONSUMER_ENABLED: ${ACCOUNT_DELETED_CONSUMER_ENABLED:-true}
    volumes:
      - ${JWT_KEYS_DIR:?JWT_KEYS_DIR is required}/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Notificaciones: entrega las alertas y recomendaciones a los miembros de un hogar por correo,
  # Web Push y push movil; envia los codigos de verificacion y recuperacion del servicio de
  # seguridad; guarda las notificaciones de los administradores y el registro de envios. Solo
  # recibe public.pem.
  notification:
    build:
      context: ${NOTIFICATION_CONTEXT:-../backend/en-monitor-notification-service}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets notification-*, que el
      # backend ya aplico, asi que no ejecuta ninguno.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Nombres y correos de los destinatarios, los administradores y el permiso USER.READ.
      SECURITY_SERVICE_URL: http://security:8082
      # Los miembros y el nombre de un hogar, y el nombre de un dispositivo.
      HOME_SERVICE_URL: http://home:8086
      DEVICE_SERVICE_URL: http://device:8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NOTIFICATION_WEB_URL: ${NOTIFICATION_WEB_URL:?NOTIFICATION_WEB_URL is required}
      # Las mismas llaves VAPID que el backend: los navegadores ligan su suscripcion a la publica.
      NOTIFICATION_VAPID_PUBLIC_KEY: ${NOTIFICATION_VAPID_PUBLIC_KEY:-}
      NOTIFICATION_VAPID_PRIVATE_KEY: ${NOTIFICATION_VAPID_PRIVATE_KEY:-}
      # Push a las apps moviles por el relay de Expo. Vacio = push movil desactivado.
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Los eventos de cuenta y los codigos de correo (account.*, mail.*) y las alertas y
      # recomendaciones (alert.raised, recommendation.created). El backend ya no tiene modulo de
      # notificaciones: este servicio es el unico que lo hace. En false solo para volver atras a un
      # backend que aun lo tenga.
      SECURITY_EVENTS_CONSUMER_ENABLED: ${SECURITY_EVENTS_CONSUMER_ENABLED:-true}
      ALERT_EVENTS_CONSUMER_ENABLED: ${ALERT_EVENTS_CONSUMER_ENABLED:-true}
      # La bienvenida (account.first-signed-in) y la actividad de hogares y dispositivos (home.*,
      # device.linked, device.unlinked). Su cola debe existir antes de que seguridad y hogares
      # publiquen esos eventos: sus outboxes se detienen ante un mensaje que ninguna cola recibe.
      ACTIVITY_CONSUMER_ENABLED: ${ACTIVITY_CONSUMER_ENABLED:-true}
    volumes:
      - ${JWT_KEYS_DIR:?JWT_KEYS_DIR is required}/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ${BACKEND_CONTEXT:-../backend/energy-monitor-backend}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      # Solo valida los tokens: recibe la clave publica, nunca la privada.
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Lee los dispositivos (con cache) del servicio de dispositivos.
      DEVICE_SERVICE_URL: http://device:8084
      # Niveles de consumo y energia del servicio de mediciones; cada lectura llega por RabbitMQ.
      MEASUREMENT_SERVICE_URL: http://measurement:8085
      # Lee los hogares, sus miembros y sus limites (con cache) del servicio de hogares.
      HOME_SERVICE_URL: http://home:8086
      # Publica alert.raised y recommendation.created desde su outbox al servicio de notificaciones,
      # el unico que los entrega. En false solo para volver atras a un servicio de notificaciones
      # con los consumidores apagados: los eventos esperan en backend_outbox.
      ALERT_OUTBOX_RELAY_ENABLED: ${ALERT_OUTBOX_RELAY_ENABLED:-true}
    volumes:
      - ${JWT_KEYS_DIR:?JWT_KEYS_DIR is required}/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Unica entrada de la API. Detras de dos proxies (el nginx del host y el del frontend): toma la
  # IP del cliente de X-Forwarded-For solo si la conexion viene de la red de Docker, y la pasa a
  # los servicios, que la usan para el limite de intentos y el registro de accesos.
  gateway:
    build:
      context: ${GATEWAY_CONTEXT:-../backend/en-monitor-api-gateway}
    depends_on:
      security:
        condition: service_started
      device:
        condition: service_started
      measurement:
        condition: service_started
      home:
        condition: service_started
      notification:
        condition: service_started
      backend:
        condition: service_started
    environment:
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      SECURITY_CORS_ALLOWED_ORIGINS: ${SECURITY_CORS_ALLOWED_ORIGINS:?SECURITY_CORS_ALLOWED_ORIGINS is required}
      SECURITY_SERVICE_URL: http://security:8082
      DEVICE_SERVICE_URL: http://device:8084
      MEASUREMENT_SERVICE_URL: http://measurement:8085
      HOME_SERVICE_URL: http://home:8086
      NOTIFICATION_SERVICE_URL: http://notification:8087
      BACKEND_URL: http://backend:8083
    volumes:
      - ${JWT_KEYS_DIR:?JWT_KEYS_DIR is required}/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 30s
    restart: unless-stopped

  # La imagen del broker no trae /mosquitto/data: el volumen nace con dueño root y Mosquitto
  # (uid 1000) no podria guardar su base. Este paso se lo entrega a uid 1000.
  mosquitto-data-owner:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/mosquitto/data"]
    volumes:
      - mosquitto-data:/mosquitto/data
    restart: "no"

  mosquitto:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    depends_on:
      # Quien autentica a cada cliente MQTT.
      device:
        condition: service_started
      mosquitto-data-owner:
        condition: service_completed_successfully
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      # server.crt = fullchain.pem y server.key = privkey.pem de Let's Encrypt para el
      # dominio del broker (ver README, "Produccion").
      - ${MQTT_CERT_DIR:?MQTT_CERT_DIR is required}:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../frontend/energy-monitor-web}
      args:
        # Vacio = rutas relativas; nginx reenvia /api/ al gateway (mismo origen).
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  mysql-data:
  rabbitmq-data:
  mosquitto-data:
