# =============================================================================
# EnergyMonitor - Pila completa LOCAL (base de datos, mensajeria, MQTT, servicios y frontend)
# =============================================================================
# Levanta todo el sistema en contenedores sobre Docker, sin depender de un servidor:
#
#   cd infra
#   cp .env.example .env          # rellena los CHANGE_ME
#   ./prepare.sh                  # genera las claves RSA y los certificados del broker
#   docker compose up -d --build
#
# Servicios y puertos publicados:
#   80    frontend (nginx): sirve la web y reenvia /api/ al API gateway (mismo origen, sin CORS).
#   8080  API gateway, para la app movil en la LAN: http://<IP de LAN>:8080
#   8883  MQTT sobre TLS, para los dispositivos ESP32
#   1883  MQTT sin TLS, solo en 127.0.0.1
#   3306  MySQL, solo en 127.0.0.1 [para depurar desde este PC]
#   5672  RabbitMQ (AMQP), solo en 127.0.0.1; 15672 su consola web, solo en 127.0.0.1
#
# El gateway es la unica entrada de la API: reenvia /api/v1/auth/** y /api/v1/admin/users|roles/**
# al servicio de seguridad (8082), /api/v1/homes/*/devices/** y /api/v1/appliance-types/** al
# servicio de dispositivos (8084), /api/v1/measurements/**, /api/v1/consumption-levels/** y
# /api/v1/homes/*/consumption/** al servicio de mediciones (8085), el resto de /api/v1/homes/** y
# /api/v1/home-types/** al servicio de hogares (8086), /api/v1/notifications/** y
# /api/v1/admin/notifications/** al servicio de notificaciones (8087), /api/v1/alerts/** al
# servicio de alertas (8088) y /api/v1/recommendations/** al servicio de recomendaciones (8089); el
# resto responde 404. Los servicios no publican puertos: solo se alcanzan por la red de
# Docker, asi que /internal/** nunca queda expuesto. El gateway publica 8080 para la app movil y
# rechaza /internal/**.
#
# La integracion MQTT ya esta hecha en el codigo: el broker delega la autenticacion de cada
# cliente en el servicio de dispositivos (POST /internal/mqtt/auth/user y /acl). Aqui solo se
# pone al broker y a ese servicio en la misma red Docker y se usa el mismo mosquitto.conf que en
# produccion (./mosquitto/mosquitto.conf), donde "device" resuelve al servicio de abajo.
#
# Otros modos (ver README):
#   docker-compose.dev.yml   solo MySQL, RabbitMQ y el broker; los servicios corren en este PC (./mvnw)
#   docker-compose.prod.yml  despliegue en un servidor (Let's Encrypt, proxy HTTPS delante)

name: energy-monitor

services:
  mysql:
    image: mysql:8.4
    container_name: energy-monitor-mysql
    environment:
      MYSQL_DATABASE: energy_monitor
      MYSQL_USER: energy_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Solo loopback: para depurar desde este PC sin exponer la base a la red (Wi-Fi/hotspot).
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cola de los eventos de cuenta y de los pedidos de correo entre el servicio de seguridad y el
  # backend (outbox). El nombre de host fijo importa: RabbitMQ guarda sus datos por nodo, y con el
  # nombre aleatorio de cada contenedor el volumen quedaria huerfano al recrearlo.
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: energy-monitor-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      # Solo loopback: los servicios en este PC (modo desarrollo) y la consola web.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Cuentas, sesiones, roles y permisos. Firma los tokens con private.pem.
  security:
    build:
      context: ${SECURITY_CONTEXT:-../backend/en-monitor-security-service}
    image: energy-monitor-security:local
    container_name: energy-monitor-security
    # La imagen corre como uid 10001; BACKEND_UID/GID deben ser el dueño de ./keys
    # para que el proceso pueda leer private.pem (ver README).
    user: "${BACKEND_UID:-10001}:${BACKEND_GID:-10001}"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que el backend: cada uno con sus tablas y sus changesets.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PRIVATE_KEY_PATH: /run/keys/private.pem
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      SECURITY_RESET_PEPPER: ${SECURITY_RESET_PEPPER:?SECURITY_RESET_PEPPER is required}
      # La web recibe los tokens en cookies HttpOnly. Esta pila sirve HTTP (http://localhost), así
      # que sin Secure: con él el navegador las descartaría. En producción (HTTPS) va activado.
      SECURITY_SESSION_COOKIE_SECURE: "false"
      # Mismo cliente OAuth que el frontend (VITE_GOOGLE_CLIENT_ID). El servicio canjea el
      # codigo de Google, asi que necesita el secreto, que nunca llega al navegador.
      # Vacio en ambos = boton de Google desactivado (503).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Código por correo para borrar una cuenta creada con Google (mail.account-deletion). Solo
      # en true cuando el servicio de notificaciones ya escucha ese correo: si no, el mensaje se
      # queda primero en el outbox y frena todos los correos que vienen detrás.
      SECURITY_ACCOUNT_DELETION_CODE_MAIL_ENABLED: ${SECURITY_ACCOUNT_DELETION_CODE_MAIL_ENABLED:-false}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Antes de borrar una cuenta pregunta al servicio de hogares si puede (deletion-check).
      HOME_SERVICE_URL: http://home:8086
    volumes:
      - ./keys:/run/keys:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Dispositivos: vinculacion, credenciales MQTT, autenticacion del broker, comandos y
  # conectividad. Solo recibe public.pem (valida los tokens, no los firma).
  device:
    build:
      context: ${DEVICE_CONTEXT:-../backend/en-monitor-device-service}
    image: energy-monitor-device:local
    container_name: energy-monitor-device
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets device-*.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Pregunta al servicio de hogares si quien llama es miembro o dueño del hogar.
      HOME_SERVICE_URL: http://home:8086
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Se suscribe a telemetria y estado (conectividad) y envia los comandos, por el listener
      # interno (1883) de la misma red.
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_CLIENT_ID: device-service-local
      MQTT_DEVICE_SERVICE_USER: ${MQTT_DEVICE_SERVICE_USER:-em-device-service}
      MQTT_DEVICE_SERVICE_PASS: ${MQTT_DEVICE_SERVICE_PASS:?MQTT_DEVICE_SERVICE_PASS is required}
      # El broker le pregunta tambien por el servicio de mediciones: estas son las credenciales que
      # acepta para el (solo lee la telemetria).
      MQTT_MEASUREMENT_SERVICE_USER: ${MQTT_MEASUREMENT_SERVICE_USER:-em-measurement-service}
      MQTT_MEASUREMENT_SERVICE_PASS: ${MQTT_MEASUREMENT_SERVICE_PASS:?MQTT_MEASUREMENT_SERVICE_PASS is required}
      # Solo la red interna de Docker (y loopback) puede llamar a /internal/mqtt/auth/**.
      MQTT_AUTH_ALLOWED_NETWORKS: 172.16.0.0/12,127.0.0.1/32
      # Direccion del broker que la web escribe al modulo al vincularlo por Bluetooth:
      # la IP de LAN de este PC (nunca localhost) o el dominio del broker.
      DEVICE_MQTT_PUBLIC_HOST: ${DEVICE_MQTT_PUBLIC_HOST:?DEVICE_MQTT_PUBLIC_HOST is required}
      DEVICE_MQTT_PUBLIC_PORT: ${DEVICE_MQTT_PUBLIC_PORT:-8883}
    volumes:
      - ./keys/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    # Al parar se desuscribe del broker y cierra las peticiones en curso.
    stop_grace_period: 30s
    restart: unless-stopped

  # Mediciones: guarda la telemetria de los modulos y sirve el historial, el consumo de un hogar
  # y los niveles de consumo; anuncia cada lectura al servicio de alertas (measurement.recorded).
  # Solo recibe public.pem.
  measurement:
    build:
      context: ${MEASUREMENT_CONTEXT:-../backend/en-monitor-measurement-service}
    image: energy-monitor-measurement:local
    container_name: energy-monitor-measurement
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets measurement-*.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Pregunta al servicio de hogares si quien llama es miembro del hogar y sus limites, y al
      # servicio de dispositivos de que hogar es cada modulo.
      HOME_SERVICE_URL: http://home:8086
      DEVICE_SERVICE_URL: http://device:8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Se suscribe a la telemetria por el listener interno (1883) de la misma red y guarda cada
      # lectura. Es el unico que la guarda: el backend ya no se conecta al broker.
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_CLIENT_ID: measurement-service-local
      MQTT_MEASUREMENT_SERVICE_USER: ${MQTT_MEASUREMENT_SERVICE_USER:-em-measurement-service}
      MQTT_MEASUREMENT_SERVICE_PASS: ${MQTT_MEASUREMENT_SERVICE_PASS:?MQTT_MEASUREMENT_SERVICE_PASS is required}
      MEASUREMENT_MQTT_ENABLED: "true"
    volumes:
      - ./keys/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    # Al parar se desuscribe del broker y cierra las peticiones en curso.
    stop_grace_period: 30s
    restart: unless-stopped

  # Hogares: crea hogares, une miembros con el codigo de acceso, roles, favoritos, transferencia
  # del dueño, umbrales de consumo y tipos de hogar; responde a los otros servicios quien puede
  # actuar sobre un hogar. Solo recibe public.pem.
  home:
    build:
      context: ${HOME_CONTEXT:-../backend/en-monitor-home-service}
    image: energy-monitor-home:local
    container_name: energy-monitor-home
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets home-*, que el backend ya
      # aplico, asi que no ejecuta ninguno.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Los nombres de los miembros de un hogar.
      SECURITY_SERVICE_URL: http://security:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Publica home.deleted desde su outbox (el servicio de dispositivos desvincula los modulos) y
      # limpia los hogares y las membresias de las cuentas borradas (account.deleted). El backend ya
      # no tiene modulo de hogares: este servicio es el unico que lo hace. En false solo para
      # volver atras a un backend que aun lo tenga.
      HOME_OUTBOX_RELAY_ENABLED: ${HOME_OUTBOX_RELAY_ENABLED:-true}
      ACCOUNT_DELETED_CONSUMER_ENABLED: ${ACCOUNT_DELETED_CONSUMER_ENABLED:-true}
    volumes:
      - ./keys/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Notificaciones: entrega las alertas y recomendaciones a los miembros de un hogar por correo,
  # Web Push y push movil; envia los codigos de verificacion y recuperacion del servicio de
  # seguridad; guarda las notificaciones de los administradores y el registro de envios. Solo
  # recibe public.pem.
  notification:
    build:
      context: ${NOTIFICATION_CONTEXT:-../backend/en-monitor-notification-service}
    image: energy-monitor-notification:local
    container_name: energy-monitor-notification
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets notification-*, que el
      # backend ya aplico, asi que no ejecuta ninguno.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Nombres y correos de los destinatarios, los administradores y el permiso USER.READ.
      SECURITY_SERVICE_URL: http://security:8082
      # Los miembros y el nombre de un hogar, y el nombre de un dispositivo.
      HOME_SERVICE_URL: http://home:8086
      DEVICE_SERVICE_URL: http://device:8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NOTIFICATION_WEB_URL: ${NOTIFICATION_WEB_URL:-http://localhost}
      # Las mismas llaves VAPID que el backend: los navegadores ligan su suscripcion a la publica.
      NOTIFICATION_VAPID_PUBLIC_KEY: ${NOTIFICATION_VAPID_PUBLIC_KEY:-}
      NOTIFICATION_VAPID_PRIVATE_KEY: ${NOTIFICATION_VAPID_PRIVATE_KEY:-}
      # Push a las apps moviles por el relay de Expo. Vacio = push movil desactivado.
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Los eventos de cuenta y los codigos de correo (account.*, mail.*) y las alertas y
      # recomendaciones (alert.raised, recommendation.created). El backend ya no tiene modulo de
      # notificaciones: este servicio es el unico que lo hace. En false solo para volver atras a un
      # backend que aun lo tenga.
      SECURITY_EVENTS_CONSUMER_ENABLED: ${SECURITY_EVENTS_CONSUMER_ENABLED:-true}
      ALERT_EVENTS_CONSUMER_ENABLED: ${ALERT_EVENTS_CONSUMER_ENABLED:-true}
      # La bienvenida (account.first-signed-in) y la actividad de hogares y dispositivos (home.*,
      # device.linked, device.unlinked). Su cola debe existir antes de que seguridad y hogares
      # publiquen esos eventos: sus outboxes se detienen ante un mensaje que ninguna cola recibe.
      ACTIVITY_CONSUMER_ENABLED: ${ACTIVITY_CONSUMER_ENABLED:-true}
    volumes:
      - ./keys/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Alertas: crea las alertas de umbral, de limite de consumo, de conectividad y de dispositivo
  # vinculado a partir de las lecturas (measurement.recorded) y de los eventos de dispositivos, y las
  # anuncia (alert.raised) al servicio de notificaciones. Solo recibe public.pem.
  alert:
    build:
      context: ${ALERT_CONTEXT:-../backend/en-monitor-alert-service}
    image: energy-monitor-alert:local
    container_name: energy-monitor-alert
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets alert-*. El backend ya
      # aplico alert-001 a alert-003; este servicio crea alert_outbox (alert-004).
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Quien puede leer las alertas de un hogar y sus limites; el hogar de un dispositivo; los
      # niveles de consumo y la energia de los dispositivos.
      HOME_SERVICE_URL: http://home:8086
      DEVICE_SERVICE_URL: http://device:8084
      MEASUREMENT_SERVICE_URL: http://measurement:8085
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Crear las alertas desde sus colas (alert-service.measurement.recorded y
      # alert-service.device.events). Encendido: el backend que tambien las creaba ya no existe. En
      # false solo para volver atras a ese backend.
      ALERT_CONSUMERS_ENABLED: ${ALERT_CONSUMERS_ENABLED:-true}
      # Publica alert_outbox (alert.raised).
      ALERT_OUTBOX_RELAY_ENABLED: ${ALERT_SERVICE_OUTBOX_RELAY_ENABLED:-true}
      ALERT_LIMIT_ZONE: ${ALERT_LIMIT_ZONE:-America/Bogota}
    volumes:
      - ./keys/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Recomendaciones: cada hora revisa la energia por hora de los hogares que reportan y guarda una
  # recomendacion cuando una regla se cumple (pico de la tarde, consumo nocturno, semana contra
  # semana, proyeccion del limite, aumento por dispositivo); las anuncia (recommendation.created) al
  # servicio de notificaciones. Solo recibe public.pem.
  recommendation:
    build:
      context: ${RECOMMENDATION_CONTEXT:-../backend/en-monitor-recommendation-service}
    image: energy-monitor-recommendation:local
    container_name: energy-monitor-recommendation
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Cualquier perfil distinto de "local" (el de application-local.yaml).
      SPRING_PROFILES_ACTIVE: prod
      # La misma base que los otros servicios: aplica solo los changesets recommendation-*. El
      # backend ya aplico recommendation-001; este servicio crea recommendation_outbox
      # (recommendation-002).
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/energy_monitor?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: energy_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      # Quien puede leer las recomendaciones de un hogar y su limite; los dispositivos de un hogar y
      # sus nombres; la energia por hora y los dispositivos que reportan.
      HOME_SERVICE_URL: http://home:8086
      DEVICE_SERVICE_URL: http://device:8084
      MEASUREMENT_SERVICE_URL: http://measurement:8085
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-energy-monitor}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # La evaluacion cada hora. Encendida: el backend que tambien evaluaba ya no existe. En false
      # solo para volver atras a ese backend.
      RECOMMENDATION_SCHEDULER_ENABLED: ${RECOMMENDATION_SCHEDULER_ENABLED:-true}
      # Publica recommendation_outbox (recommendation.created).
      RECOMMENDATION_OUTBOX_RELAY_ENABLED: ${RECOMMENDATION_OUTBOX_RELAY_ENABLED:-true}
      RECOMMENDATION_ZONE: ${RECOMMENDATION_ZONE:-America/Bogota}
    volumes:
      - ./keys/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s
    restart: unless-stopped

  # Unica entrada de la API: CORS, token, limite de intentos y reparto entre los servicios.
  gateway:
    build:
      context: ${GATEWAY_CONTEXT:-../backend/en-monitor-api-gateway}
    image: energy-monitor-gateway:local
    container_name: energy-monitor-gateway
    depends_on:
      security:
        condition: service_started
      device:
        condition: service_started
      measurement:
        condition: service_started
      home:
        condition: service_started
      notification:
        condition: service_started
      alert:
        condition: service_started
      recommendation:
        condition: service_started
    environment:
      SECURITY_JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
      # Con el nginx del frontend delante la web es del mismo origen; solo hace falta para otro
      # origen (p. ej. el servidor de desarrollo de Vite).
      SECURITY_CORS_ALLOWED_ORIGINS: ${SECURITY_CORS_ALLOWED_ORIGINS:-http://localhost}
      SECURITY_SERVICE_URL: http://security:8082
      DEVICE_SERVICE_URL: http://device:8084
      MEASUREMENT_SERVICE_URL: http://measurement:8085
      HOME_SERVICE_URL: http://home:8086
      NOTIFICATION_SERVICE_URL: http://notification:8087
      ALERT_SERVICE_URL: http://alert:8088
      RECOMMENDATION_SERVICE_URL: http://recommendation:8089
    ports:
      # La app movil (APK) en la LAN llama directo al gateway: http://<IP de LAN>:8080
      - "8080:8080"
    volumes:
      - ./keys/public.pem:/run/keys/public.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 30s
    restart: unless-stopped

  # La imagen del broker no trae /mosquitto/data, asi que el volumen nace con dueño root y
  # Mosquitto (uid 1000) no puede guardar su base ("Error saving in-memory database ...
  # Permission denied"). Este paso le da el volumen a uid 1000 antes de arrancar el broker.
  mosquitto-data-owner:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/mosquitto/data"]
    volumes:
      - mosquitto-data:/mosquitto/data
    restart: "no"

  mosquitto:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    container_name: energy-monitor-mqtt
    depends_on:
      # Quien autentica a cada cliente MQTT.
      device:
        condition: service_started
      mosquitto-data-owner:
        condition: service_completed_successfully
    ports:
      # Listener interno de los servicios, solo loopback.
      - "127.0.0.1:1883:1883"
      # Dispositivos por TLS: toda la LAN.
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      # Certificados de desarrollo (prepare.sh). Deben existir antes de arrancar.
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../frontend/energy-monitor-web}
      args:
        # Vacío = rutas relativas; nginx reenvía /api/ al gateway (sin CORS).
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: energy-monitor-frontend:local
    container_name: energy-monitor-frontend
    depends_on:
      - gateway
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mysql-data:
  rabbitmq-data:
  mosquitto-data:
